[package]
name = "launch-weaver-desktop"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
base64 = "0.23"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }

[[bin]]
name = "launch-weaver-desktop"
path = "src/main.rs"
required-features = ["desktop"]
