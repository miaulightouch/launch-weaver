name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release version
        run: |
          test "$TAG" = "v$(jq -r .version plugin.json)"
          test "$TAG" = "v$(jq -r .version package.json)"

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Package plugin
        run: |
          mkdir -p release/launch-weaver/.millennium/Dist release/launch-weaver/backend
          cp plugin.json README.md LICENSE release/launch-weaver/
          cp -R assets release/launch-weaver/
          cp .millennium/Dist/index.js release/launch-weaver/.millennium/Dist/
          cp backend/main.lua backend/ini.lua release/launch-weaver/backend/
          cd release
          zip -qr "../launch-weaver-${TAG}.zip" launch-weaver

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "launch-weaver-${TAG}.zip" --clobber

  standalone:
    needs: release
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf xz-utils
          rustup update stable
          rustup default stable

      - run: bun install --frozen-lockfile
      - run: bun run desktop:typecheck
      - run: bun run desktop:test --locked
      - name: Build standalone packages
        run: bun run desktop:build --ci --bundles deb,rpm,appimage -- --locked

      - name: Prepare standalone release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          for extension in deb rpm AppImage; do
            files=(desktop/src-tauri/target/release/bundle/*/*."$extension")
            if (( ${#files[@]} != 1 )); then
              echo "Expected exactly one $extension bundle, found ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" "release-assets/launch-weaver-standalone-${TAG}-linux-x86_64.${extension}"
          done
          cd release-assets
          sha256sum ./* > "launch-weaver-standalone-${TAG}-SHA256SUMS"

      - name: Upload standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release-assets/* --clobber
